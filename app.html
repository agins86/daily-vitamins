<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
<title>Daily Vitamins</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ---- tokens ---- */
:root{--bg:#F5F3F0;--panel:#FFFFFF;--ink:#1B1922;--ink2:#4B4654;--muted:#746D7E;--line:#E3DED8;--line2:#EEEAE5;--soft:#F1EDE8;--hover:#F7F4F0;
 --pw:#EE6F24;--tb:#6B48FF;--bad:#D7303C;--sel:#1B1922;
 --r:16px;--rs:12px;--tabh:60px;
 --sh:0 1px 2px rgba(25,15,35,.05),0 6px 16px -8px rgba(25,15,35,.14);
 --st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121016;--panel:#1C1920;--ink:#F3EFF6;--ink2:#D2CBDA;--muted:#9C94A8;--line:#2E2936;--line2:#262129;--soft:#242029;--hover:#221E29;
 --pw:#FF8A45;--tb:#9376FF;--bad:#FF6B74;--sel:#F3EFF6;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:"Nunito",system-ui,sans-serif;font-size:15px;font-weight:500;color:var(--ink);background:var(--bg);line-height:1.4;min-height:100vh;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
[hidden]{display:none!important}
.view{max-width:560px;margin:0 auto;padding:calc(var(--st) + 10px) 16px calc(var(--tabh) + var(--sb) + 28px)}
/* ---- header ---- */
.hd{display:flex;align-items:center;gap:8px;min-height:56px;margin:0 0 14px}
.hd .d{flex:1;min-width:0;padding-left:2px}
.hd .sub{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1{font-family:"Fredoka","Nunito",sans-serif;font-size:1.65rem;font-weight:600;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.hb{display:flex;align-items:center;gap:6px;flex:none}
.nav,.chip{position:relative;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.nav::after,.chip::after,.x::after,.ed::after{content:"";position:absolute;inset:-3px}
.nav{width:44px}.nav svg{width:20px;height:20px}
.nav:disabled{opacity:.3;box-shadow:none}
.nav:active,.chip:active{background:var(--hover)}
.chip{padding:0 14px;background:var(--sel);color:var(--bg);border-color:transparent;font-weight:800;font-size:.84rem}
.chip:active{opacity:.85;background:var(--sel)}
/* ---- home: big icon buttons ---- */
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin:4px 0 16px}
.big{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;padding:6px 4px 0;transition:transform .12s}
.big:active{transform:scale(.95)}
.big .ico{width:100%}
.big .ico svg{width:100%;height:auto;max-height:clamp(150px,24vh,230px);margin:0 auto;filter:drop-shadow(0 8px 10px rgba(30,15,50,.16))}
.big.t .ico svg{width:84%}
.big.pop .ico{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-5deg)}100%{transform:scale(1)}}
.big .n{position:absolute;top:0;right:6%;min-width:34px;height:30px;padding:0 10px;border-radius:999px;background:var(--sel);color:var(--bg);font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:1}
.big .n:empty{display:none}
/* ---- card / log ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card h2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:"Fredoka","Nunito",sans-serif;font-size:1.05rem;font-weight:600}
.card h2 span{font-family:"Nunito",sans-serif;font-size:.78rem;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log{list-style:none}
#log li{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 14px;border-top:1px solid var(--line2)}
#log li:first-child{border-top:0}
#log .dot{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--c)}
#log .dot svg{width:28px;height:28px}
#log li.p{--c:var(--pw)}#log li.t{--c:var(--tb)}
#log .w{flex:1;min-width:0;line-height:1.25}
#log .w b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .w small{display:block;color:var(--muted);font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log input[type=time]{flex:none;width:6.1em;font:inherit;font-size:.84rem;font-weight:700;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:9px;padding:6px 8px;min-height:36px;text-align:center;-webkit-user-select:text;user-select:text}
#log input[type=time]::-webkit-calendar-picker-indicator{display:none}
#log input[type=time]:focus{outline:0;border-color:var(--c)}
#log .x{position:relative;flex:none;width:40px;height:40px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
#log .x svg{width:16px;height:16px}
#log .x:active{background:var(--soft)}
#log .empty{display:block;color:var(--muted);font-weight:700;text-align:center;padding:26px 16px}
.foot{display:flex;justify-content:center;gap:6px;margin-top:18px}
.foot button,.foot label{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;color:var(--muted);font-weight:800;font-size:.8rem;cursor:pointer}
.foot svg{width:16px;height:16px}
.foot button:active,.foot label:active{background:var(--soft)}
.foot input{display:none}
/* ---- tab bar ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs .in{display:flex;max-width:560px;margin:0 auto;height:var(--tabh)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:800;letter-spacing:.03em;color:var(--muted)}
.tabs button.on{color:var(--ink)}
.tabs button.on .tbi{background:var(--soft)}
.tabs .tbi{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.tabs svg{width:22px;height:22px}
/* ---- calendar ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.st{padding:10px 12px 9px;min-width:0}
.st b{display:block;font-family:"Fredoka","Nunito",sans-serif;font-size:1.2rem;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.st small{display:block;margin-top:2px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal{padding:10px 8px 8px}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:54px;padding:6px 1px 5px;border-radius:10px;background:var(--panel);border:1px solid transparent;font-variant-numeric:tabular-nums;min-width:0}
.day:active{background:var(--hover)}
.day .dn{font-size:.82rem;font-weight:700;line-height:1;color:var(--ink2)}
.day .dm{font-family:"Fredoka","Nunito",sans-serif;font-size:.68rem;font-weight:600;line-height:1;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.e .dn{color:var(--muted);font-weight:600}
.day.has{background:color-mix(in srgb,var(--tb) var(--i),var(--panel));border-color:color-mix(in srgb,var(--tb) 18%,var(--line))}
.day.td .dn{color:var(--tb);font-weight:800}
.day.td::before{content:"";position:absolute;left:50%;top:21px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tb)}
.day.sel{box-shadow:inset 0 0 0 2px var(--sel);border-color:var(--sel)}
.day.fut{opacity:.32;pointer-events:none}
.day:disabled{pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.rl{min-width:0}.rl b{display:block;font-weight:800}
.rl small,.row>small{display:block;color:var(--muted);font-size:.78rem;font-weight:700;line-height:1.35;margin-top:2px}
.row>small{margin:0}
.row input[type=time]{flex:none;width:9.4em;font:inherit;font-weight:800;min-height:44px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;-webkit-user-select:text;user-select:text}
.rb{flex:none;min-height:40px;padding:0 14px;border-radius:10px;background:var(--soft);font-weight:800;font-size:.84rem}
.rb:disabled{opacity:.4}
.ostat{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin:14px 0 6px}
.ostat div{background:var(--soft);border-radius:12px;padding:9px 10px;min-width:0}
.ostat b{display:block;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ostat small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.onote{color:var(--muted);font-weight:700;font-size:.86rem;margin:2px 2px 0}
.acts{margin-top:8px}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 6px;border-top:1px solid var(--line2);text-align:left;font-weight:800;font-size:1rem}
.act:first-child{border-top:0}
.act svg{flex:none;width:22px;height:22px;color:var(--c)}
.act span{flex:1;min-width:0}.act small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.act:active{background:var(--hover)}
.act.bad,.act.bad svg{color:var(--bad)}
.dq{margin:12px 2px 2px;font-weight:700;color:var(--ink2)}
.ti .it{-webkit-touch-callout:none}
.legend{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:.76rem;font-weight:700;color:var(--muted);line-height:1.35}
.legend i{flex:none;width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--tb) 38%,var(--panel));border:1px solid color-mix(in srgb,var(--tb) 30%,var(--line))}
/* ---- item list (sub-screen) ---- */
#list.p{--c:var(--pw)}#list.t{--c:var(--tb)}
#list h1 .hi{flex:none;width:30px;height:30px;border-radius:9px;background:var(--c);display:flex;align-items:center;justify-content:center}
#list h1 .hi svg{width:20px;height:20px}
.hint{color:var(--muted);font-weight:700;font-size:.82rem;margin:-4px 2px 16px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.ti{position:relative;min-width:0}
.it{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;color:var(--tx);text-align:center;
 background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--ic) 68%,#fff) 0,var(--ic) 58%,color-mix(in srgb,var(--ic) 84%,#000) 100%);
 box-shadow:inset 0 -4px 8px rgba(0,0,0,.16),inset 0 3px 6px rgba(255,255,255,.26),0 0 0 1px rgba(0,0,0,.06),0 8px 14px -8px var(--ic);transition:transform .1s}
.ti.p .it{border-radius:0;background:none;box-shadow:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 12% 15%;color:var(--tx)}
.ti.p .it::before{content:"";position:absolute;top:0;left:22%;right:22%;height:19%;border-radius:9px 9px 5px 5px;background:#6A5478 repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.14) 7px 9px);box-shadow:0 2px 3px rgba(0,0,0,.2)}
.ti.p .it::after{display:block;content:"";position:absolute;z-index:0;left:4%;right:4%;top:15%;bottom:0;height:auto;margin:0;border:3px solid #C9A98C;border-radius:26% 26% 30% 30%;
 background:linear-gradient(var(--ic),color-mix(in srgb,var(--ic) 80%,#000)) bottom/100% 80% no-repeat,color-mix(in srgb,var(--panel) 55%,transparent);box-shadow:inset 6px 0 0 -2px rgba(255,255,255,.55),0 8px 12px -8px rgba(0,0,0,.35)}
.ti.p .it .top,.ti.p .it .bot{position:relative;z-index:1;left:auto;right:auto;top:auto;bottom:auto;padding:0;max-width:100%}
.ti.p .it .bot{margin-top:2px}
.ti.p .it b{-webkit-line-clamp:1}
.ti.p .ed{bottom:auto;top:-4px}
.it:active{transform:scale(.94)}
.it::after{content:"";position:absolute;left:9%;right:9%;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:rgba(0,0,0,.26);box-shadow:0 1.5px 0 rgba(255,255,255,.32);pointer-events:none}
.it .top{position:absolute;left:13%;right:13%;bottom:50%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;min-width:0}
.it .bot{position:absolute;left:11%;right:11%;top:50%;padding-top:7px;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:.92rem;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.it small{display:block;font-weight:900;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:.92rem;line-height:1.05;max-width:100%;overflow-wrap:anywhere}
.it .n{position:absolute;top:-7px;left:-7px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--sel);color:var(--bg);font-weight:800;font-size:.76rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);z-index:1}
.ti .ed{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.ti .ed svg{width:15px;height:15px}
.addit{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:50%;color:var(--c)}
#list.p .addit{border-radius:26%}
.addit svg{width:30%;height:30%}
.addit:active{background:var(--soft)}
.emptyl{grid-column:1/-1;text-align:center;color:var(--muted);font-weight:700;padding:24px 8px 6px}
/* ---- dialogs (bottom sheets) ---- */
dialog{position:fixed;inset:auto 0 0 0;margin:0 auto;border:0;border-radius:22px 22px 0 0;padding:10px 18px calc(var(--sb) + 16px);width:100%;max-width:560px;max-height:calc(100vh - var(--st) - 24px);overflow:auto;background:var(--panel);color:var(--ink);box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
dialog.p{--c:var(--pw)}dialog.t{--c:var(--tb)}
dialog::backdrop{background:rgba(15,10,20,.5)}
dialog::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
dialog h3{font-family:"Fredoka","Nunito",sans-serif;font-size:1.3rem;font-weight:600;margin:0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog label{display:block;font-weight:800;font-size:.7rem;color:var(--muted);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.07em}
dialog input,dialog textarea{display:block;width:100%;font:inherit;font-size:1rem;font-weight:700;min-height:48px;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);color:var(--ink);-webkit-user-select:text;user-select:text;outline:0}
dialog input:focus,dialog textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
dialog textarea{resize:vertical;min-height:3rem}
.mgw{position:relative}.mgw span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800;pointer-events:none}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;min-height:48px;padding:0 14px;border-radius:var(--rs);font-weight:800;font-size:.95rem;background:var(--soft);color:var(--ink)}
.btns .ok{background:var(--c);color:#fff;flex:1.5}
.btns .ok.bad{background:var(--bad)}
.btns .del{flex:none;color:var(--bad)}
.btns button:active{filter:brightness(.94)}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:2px}
.sw button{width:34px;height:34px;border-radius:50%;background:var(--sc);box-shadow:inset 0 -3px 5px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);border:3px solid transparent;outline:0}
.sw button.on{border-color:var(--panel);box-shadow:0 0 0 2px var(--sc),inset 0 -3px 5px rgba(0,0,0,.18)}
.sw .cust{position:relative;width:34px;height:34px;border-radius:50%;background:conic-gradient(#f44,#fc4,#4d4,#4cf,#74f,#f4c,#f44);overflow:hidden;cursor:pointer;margin:0;padding:0}
.sw .cust.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.sw .cust input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer;padding:0;border:0}
.qsub{color:var(--muted);font-weight:700;margin:0 2px 6px}
.qrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 10px}
.qb{width:60px;height:60px;border-radius:16px;background:var(--soft);color:var(--c);display:flex;align-items:center;justify-content:center}
.qb svg{width:26px;height:26px}
.qb:active{transform:scale(.94)}
#qn{min-width:3.5rem;text-align:center;font-family:"Fredoka","Nunito",sans-serif;font-size:3.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.qp{display:flex;justify-content:center;gap:8px}
.qp button{width:52px;height:40px;border-radius:10px;background:var(--soft);font-weight:800;color:var(--muted)}
.qp button.on{background:var(--c);color:#fff}
.qt{text-align:center;color:var(--muted);font-weight:800;margin-top:10px;min-height:1.4em}
.err{color:var(--bad);font-weight:800;font-size:.85rem;margin:10px 2px 0}
.tw{display:flex;gap:8px}.tw input{flex:1;font-size:1.15rem}
.tw button{flex:none;min-width:72px;padding:0 16px;border-radius:var(--rs);background:var(--soft);font-weight:800;color:var(--muted)}
.tw button.on{background:var(--c);color:#fff}
.bigtime{text-align:center;font-family:"Fredoka","Nunito",sans-serif!important;font-size:2rem!important;margin:8px 0 2px}
#td{--c:var(--pw)}
/* ---- narrow phones ---- */
@media (max-width:380px){.hd h1{font-size:1.45rem}.nav{width:40px}.chip{padding:0 11px;font-size:.8rem}.st{padding:10px 9px 9px}.st small{font-size:.6rem;letter-spacing:.03em}.items{gap:16px 10px}}
/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 12px);transform:translate(-50%,calc(100% + var(--tabh) + 40px));display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 24px);max-width:536px;
 background:var(--sel);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);transition:transform .25s;z-index:5}
#toast.on{transform:translate(-50%,0)}
#toast #tm{min-width:0;line-height:1.25;overflow-wrap:anywhere}
#toast #tm small{display:block;font-weight:700;opacity:.7;font-size:.8rem}
#toast button{min-height:36px;color:var(--bg);background:rgba(128,128,128,.28);padding:0 12px;border-radius:9px;font-weight:800;font-size:.86rem;white-space:nowrap}
#toast button:empty{display:none}
#toast .tbs{display:flex;gap:6px;flex:none}
</style>
</head><body>
<div id="home" class="view">
<header class="hd">
 <div class="d"><div class="sub" id="sub"></div><h1 id="h"></h1></div>
 <div class="hb"><button id="today" class="chip" hidden>Today</button><button class="nav" id="prev" aria-label="Previous day"></button><button class="nav" id="next" aria-label="Next day"></button></div>
</header>
<main class="bigs">
 <button class="big p" data-t="p" aria-label="Powders"><span class="ico" id="ip"></span><span class="n" id="np"></span></button>
 <button class="big t" data-t="t" aria-label="Tablets"><span class="ico" id="it"></span><span class="n" id="nt"></span></button>
</main>
<section class="card"><h2 id="lh"></h2><ul id="log"></ul></section>
<div class="foot"><button id="exp"></button><label id="impl"><input type="file" id="imp" accept="application/json,.json"></label></div>
</div>
<div id="cal" class="view" hidden>
<header class="hd">
 <div class="d"><div class="sub">Calendar</div><h1 id="cm"></h1></div>
 <div class="hb"><button id="ctoday" class="chip" hidden>Today</button><button class="nav" id="cprev" aria-label="Previous month"></button><button class="nav" id="cnext" aria-label="Next month"></button></div>
</header>
<div class="stats">
 <div class="card st"><b id="cs1">0</b><small>Total mg</small></div>
 <div class="card st"><b id="cs2">0</b><small>Days logged</small></div>
 <div class="card st"><b id="cs3">0</b><small>Avg mg/day</small></div>
</div>
<div class="card cal"><div class="wd" id="wd"></div><div class="grid" id="cgrid"></div></div>
<p class="legend"><i></i><span id="lgt"></span></p>
</div>
<div id="set" class="view" hidden>
<header class="hd"><div class="d"><div class="sub">Settings</div><h1>Preferences</h1></div></header>
<section class="card">
 <div class="row"><div class="rl"><b>Day starts at</b><small>Each day runs from this time until the same time the next day. Use 12:00 AM for normal calendar days.</small></div><input type="time" id="dsi" aria-label="Day starts at"></div>
 <div class="row"><small id="dsn"></small><button id="dsr" class="rb">Reset to 12:00 AM</button></div>
</section>
<section class="card" style="margin-top:12px">
 <div class="row"><div class="rl"><b>App version</b><small id="avs"></small></div><button id="avb" class="rb">Check for updates</button></div>
</section>
</div>
<div id="list" class="view" hidden>
<header class="hd">
 <button class="nav" id="back" aria-label="Back"></button>
 <div class="d"><div class="sub" id="lsub"></div><h1><span class="hi" id="lico"></span><span id="lt"></span></h1></div>
</header>
<p class="hint" id="lhint"></p>
<div class="items" id="items"></div>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
 <button id="tabhome" class="on" data-v="home"><span class="tbi"></span>Log</button>
 <button id="tabcal" data-v="cal"><span class="tbi"></span>Calendar</button>
 <button id="tabset" data-v="set"><span class="tbi"></span>Settings</button>
</div></nav>
<dialog id="fd"><form id="f" method="dialog" autocomplete="off">
 <h3 id="fh"></h3>
 <label for="fb">Brand</label><input id="fb" name="b" maxlength="60" placeholder="e.g. Nature Made">
 <label for="fy">Type</label><input id="fy" name="ty" maxlength="60" placeholder="e.g. Vitamin D3">
 <label for="fm">Mg</label><div class="mgw"><input id="fm" name="mg" inputmode="decimal" maxlength="12" placeholder="e.g. 500"><span>mg</span></div>
 <label for="fn">Note</label><textarea id="fn" name="nt" rows="2" maxlength="300" placeholder="e.g. with food"></textarea>
 <label>Color</label><div class="sw" id="sw"></div>
 <p class="err" id="ferr" hidden></p>
 <div class="btns"><button type="button" class="del" id="fdel">Delete</button><button type="button" id="fcan">Cancel</button><button class="ok" id="fok">Save</button></div>
</form></dialog>
<dialog id="qd" class="t"><form method="dialog" id="qf">
 <h3 id="qh"></h3><p class="qsub" id="qs"></p>
 <div class="qrow"><button type="button" class="qb" data-d="-1" aria-label="Fewer"></button><output id="qn">1</output><button type="button" class="qb" data-d="1" aria-label="More"></button></div>
 <div class="qp"><button type="button" data-q="1">1</button><button type="button" data-q="2">2</button><button type="button" data-q="3">3</button><button type="button" data-q="4">4</button></div>
 <p class="qt" id="qt"></p>
 <label for="qtm">Time</label><div class="tw"><input type="time" id="qtm"><button type="button" id="qnow" class="on">Now</button></div>
 <div class="btns"><button type="button" id="qc">Cancel</button><button class="ok" id="qok">Log</button></div>
</form></dialog>
<dialog id="od"><div id="obody"></div></dialog>
<dialog id="pd" class="p"><form method="dialog" id="pf" autocomplete="off">
 <h3 id="ph"></h3><p class="qsub" id="ps">How much?</p>
 <label for="pm">Amount</label><div class="mgw"><input id="pm" inputmode="decimal" maxlength="12" placeholder="e.g. 2500"><span>mg</span></div>
 <p class="qt" id="pt"></p>
 <p class="err" id="perr" hidden></p>
 <label for="ptm">Time</label><div class="tw"><input type="time" id="ptm"><button type="button" id="pnow" class="on">Now</button></div>
 <div class="btns"><button type="button" id="pc">Cancel</button><button class="ok" id="pok">Log</button></div>
</form></dialog>
<div id="toast" role="status"><span id="tm"></span><span class="tbs"><button id="tc"></button><button id="tu"></button></span></div>
<dialog id="td"><form method="dialog" id="tf"><h3 id="tdh">Change time</h3><p class="qsub" id="tds"></p>
 <input type="time" id="tdi" class="bigtime" required>
 <div class="btns"><button type="button" id="tdc">Cancel</button><button class="ok" id="tdok">Save</button></div>
</form></dialog>
<script src="native.js"></script>
<script>
const $=s=>document.querySelector(s);

 chk:I('<path d="M5 12.5l4.5 4.5L19 7.5"/>',2.6),

const ICON={
 p:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="4" rx="1.5" fill="#fff" opacity=".85"/><rect x="5" y="6.5" width="14" height="15" rx="4" fill="#fff"/><path d="M7 14.5c3-2.6 7-2.6 10 0V18a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 7 18z" fill="rgba(0,0,0,.22)"/></svg>',
 t:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#fff"/><path d="M4.5 12h15" stroke="rgba(0,0,0,.26)" stroke-width="2" stroke-linecap="round"/></svg>'};
const ICONC={p:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="1.5" width="10" height="4.5" rx="1.6" fill="#6A5478"/><rect x="4.8" y="6.8" width="14.4" height="15.4" rx="4.6" fill="none" stroke="#C9A98C" stroke-width="1.6"/><path d="M5.6 13.6c2.4-1.3 4.6-2 6.4-2.4 1.8.4 4 1.1 6.4 2.4v3.2a3.8 3.8 0 0 1-3.8 3.8H9.4a3.8 3.8 0 0 1-3.8-3.8z" fill="currentColor"/></svg>',t:ICON.t.replace(/#fff/g,'currentColor')}; // same glyphs in the kind's colour, for the log rows
const BIG={
 t:'<svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="gt" cx=".32" cy=".26" r=".95"><stop offset="0" stop-color="#C9B6FF"/><stop offset=".55" stop-color="#7C4DFF"/><stop offset="1" stop-color="#4B2BC4"/></radialGradient></defs><ellipse cx="100" cy="190" rx="60" ry="6" fill="#000" opacity=".14"/><circle cx="100" cy="100" r="88" fill="url(#gt)"/><circle cx="100" cy="100" r="87" fill="none" stroke="#3A1F9E" stroke-opacity=".35" stroke-width="2"/><circle cx="100" cy="100" r="83" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/><path d="M28 98h144" stroke="#2A1670" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/><path d="M28 104h144" stroke="#fff" stroke-opacity=".32" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="68" cy="52" rx="30" ry="14" fill="#fff" opacity=".32" transform="rotate(-28 68 52)"/></svg>',
 p:'<svg viewBox="0 0 260 232" aria-hidden="true"><defs><clipPath id="jc"><rect x="34" y="50" width="132" height="150" rx="30"/></clipPath><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset="1" stop-color="#FF7A3D"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCD3E5"/><stop offset="1" stop-color="#B3A6C1"/></linearGradient></defs><ellipse cx="130" cy="226" rx="110" ry="5" fill="#000" opacity=".14"/><rect x="8" y="180" width="244" height="42" rx="14" fill="url(#gs)" stroke="#9D8FAD" stroke-width="2"/><rect x="20" y="170" width="220" height="14" rx="7" fill="#F3EEF8" stroke="#B3A6C1" stroke-width="2"/><rect x="168" y="192" width="64" height="20" rx="5" fill="#1F2A33"/><text x="200" y="207" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="700" font-size="14" fill="#7CFFB2">5.0 g</text><circle cx="34" cy="202" r="5.5" fill="#9A8CAB"/><circle cx="54" cy="202" r="5.5" fill="#9A8CAB"/><g transform="translate(88 14) scale(.76)"><rect x="34" y="50" width="132" height="150" rx="30" fill="#fff" fill-opacity=".55"/><g clip-path="url(#jc)"><path d="M30 118C58 104 76 98 100 86c24 12 44 20 70 32v90H30z" fill="url(#gp)"/><circle cx="62" cy="140" r="3" fill="#fff" opacity=".5"/><circle cx="118" cy="158" r="2.6" fill="#fff" opacity=".45"/><circle cx="90" cy="176" r="3.2" fill="#fff" opacity=".4"/><circle cx="144" cy="132" r="2.4" fill="#fff" opacity=".45"/></g><rect x="34" y="50" width="132" height="150" rx="30" fill="none" stroke="#C9A98C" stroke-width="4"/><path d="M52 74c-4 18-4 70 0 92" stroke="#fff" stroke-opacity=".8" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="48" y="14" width="104" height="42" rx="12" fill="#5F4A6E"/><path d="M62 22v26M80 22v26M98 22v26M116 22v26M134 22v26" stroke="#fff" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/></g><path d="M44 150L20 108" stroke="#5F4A6E" stroke-width="8" stroke-linecap="round"/><path d="M40 148h52c0 22-10 24-26 24s-26-2-26-24z" fill="#F3EEF8" stroke="#C9A98C" stroke-width="3"/><path d="M42 148c8-16 40-16 48 0z" fill="url(#gp)"/><circle cx="60" cy="144" r="1.8" fill="#fff" opacity=".6"/><circle cx="74" cy="141" r="1.6" fill="#fff" opacity=".5"/></svg>'};
// ---- state ----
let S;try{S=JSON.parse(localStorage.getItem('dv'))}catch(e){}
if(!S||!Array.isArray(S.e))S={e:[]};if(!Array.isArray(S.it))S.it=[];if(!S.set||typeof S.set!=='object')S.set={};
const save=()=>localStorage.setItem('dv',JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dsm=()=>{const m=/^(\d\d):(\d\d)$/.exec(S.set.ds||'');return m?[+m[1],+m[2]]:[0,0]}; // when a day starts: default 00:00 (12 AM), changeable in Settings
const dsLabel=()=>{const[h,m]=dsm();return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const d0=t=>{const d=new Date(t),[h,m]=dsm();d.setHours(h,m,0,0);if(d.getTime()>t)d.setDate(d.getDate()-1);return d.getTime()}; // start of the day that contains t
const inDay=(ds,h,m,sec=0)=>{const d=new Date(ds);d.setHours(h,m,sec,0);if(d.getTime()<ds)d.setDate(d.getDate()+1);return d.getTime()}; // clock time h:m inside the day that starts at ds
let day=d0(Date.now()),view='home',lastToday=day;
const isToday=()=>day===d0(Date.now());
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const clk=ts=>new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dayE=()=>S.e.filter(e=>d0(e.ts)===day).sort((a,b)=>a.ts-b.ts);
const lab=x=>[x.b,x.ty].filter(Boolean).join(' ')||NAME[x.t||x.k];
const qty=e=>e.q||1;
const ecol=e=>{const it=S.it.find(i=>i.id===e.iid);return it?icol(it):(e.c||'')}; // colour of a log entry: its item's colour (kept on the entry in case the item is deleted)
const hasMg=x=>x.mg!==''&&x.mg!=null&&isFinite(+x.mg);
const emg=e=>hasMg(e)?+e.mg*qty(e):0;                       // total mg of one log entry
const mgs=x=>hasMg(x)?(+x.mg).toLocaleString()+' mg':'';
const fmg=n=>(Math.round(n*10)/10).toLocaleString();          // full number, 1 decimal max
const cmg=n=>n>=1e5?Math.round(n/1e3)+'k':n>=1e4?(Math.round(n/100)/10)+'k':n>=100?Math.round(n).toLocaleString():String(Math.round(n*10)/10); // compact for a calendar cell
const det=e=>qty(e)>1?`${qty(e)} tablets`+(hasMg(e)?` · ${fmg(emg(e))} mg`:''):mgs(e);
// ---- static icons ----
$('#ip').innerHTML=BIG.p;$('#it').innerHTML=BIG.t;
$('#prev').innerHTML=$('#cprev').innerHTML=$('#back').innerHTML=SVG.l;$('#next').innerHTML=$('#cnext').innerHTML=SVG.r;
$('#tabhome .tbi').innerHTML=SVG.log;$('#tabcal .tbi').innerHTML=SVG.cal;$('#tabset .tbi').innerHTML=SVG.gear;
$('#exp').innerHTML=SVG.up+'Export backup';$('#impl').insertAdjacentHTML('afterbegin',SVG.down+'Import backup');
$('.qb[data-d="-1"]').innerHTML=SVG.minus;$('.qb[data-d="1"]').innerHTML=SVG.plus;
// ---- views / tab bar ----
function go(v){view=v;$('#home').hidden=v!=='home';$('#cal').hidden=v!=='cal';$('#set').hidden=v!=='set';
 for(const b of document.querySelectorAll('.tabs button'))b.classList.toggle('on',b.dataset.v===v);
 if(v==='cal')cm=new Date(new Date(day).getFullYear(),new Date(day).getMonth(),1).getTime();
 scrollTo(0,0);render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(!$('#list').hidden)closeList();go(b.dataset.v)});
// ---- log view ----
function render(){
 const today=isToday(),y=day===d0(Date.now()-864e5);
 $('#h').textContent=today?'Today':y?'Yesterday':new Date(day).toLocaleDateString(undefined,{weekday:'long'});
 $('#sub').textContent=new Date(day).toLocaleDateString(undefined,{weekday:today||y?'long':undefined,month:'long',day:'numeric',year:new Date(day).getFullYear()!==new Date().getFullYear()?'numeric':undefined});
 $('#today').hidden=today;$('#next').disabled=today;
 const L=dayE();
 for(const t of['p','t']){const cnt=L.filter(e=>e.t===t).reduce((a,e)=>a+qty(e),0);$('#n'+t).textContent=cnt?'×'+cnt:''}
 const tot=L.reduce((a,e)=>a+emg(e),0);
 $('#lh').innerHTML=(today?"Today's log":'Log')+(L.length?`<span>${L.length} entr${L.length>1?'ies':'y'}${tot?' · '+fmg(tot)+' mg':''}</span>`:'');

  :`<li class="empty">Nothing logged ${today?'yet today':'this day'}.</li>`;
 if(!$('#list').hidden)renderList();
 if(view==='cal')renderCal();
 if(view==='set')renderSet();
}
// ---- calendar view ----
let cm=d0(Date.now());
const FD=(()=>{try{const L=new Intl.Locale(navigator.language),w=L.getWeekInfo?L.getWeekInfo():L.weekInfo;if(w&&w.firstDay)return w.firstDay%7}catch(e){}return 1})(); // first day of the week from the phone's locale: 0 = Sunday, 1 = Monday
$('#wd').innerHTML=Array.from({length:7},(_,i)=>`<span>${new Date(2024,0,7+(FD+i)%7).toLocaleDateString(undefined,{weekday:'short'})}</span>`).join('');
function renderCal(){
 const m=new Date(cm),Y=m.getFullYear(),M=m.getMonth(),todayTs=d0(Date.now()),now=new Date();

$('#cgrid').addEventListener('click',ev=>{const b=ev.target.closest('.day');if(!b)return;day=+b.dataset.ts;go('home')});
$('#cprev').onclick=()=>{const m=new Date(cm);cm=new Date(m.getFullYear(),m.getMonth()-1,1).getTime();renderCal()};

// ---- self-update: the installed app pulls newer versions of itself from GitHub Pages ----
const APP_VERSION=1794453419; // stamped with a timestamp by build.sh / publish.sh; 0 = development copy
const UPD_URL='https://agins86.github.io/daily-vitamins/';
const canUpd=()=>!!(window.N&&N.Filesystem&&APP_VERSION>0&&location.hostname==='localhost');
const verLabel=()=>APP_VERSION>0?new Date(APP_VERSION*1000).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Development copy (live from the laptop)';
async function checkUpdate(manual){
 if(!canUpd()){if(manual)toast('Updates apply to the installed app');return}
 try{
  const j=await (await fetch(UPD_URL+'version.json?'+Date.now(),{cache:'no-store'})).json();
  localStorage.setItem('upd_last',Date.now());
  if(!(j.v>APP_VERSION)||j.v<=(+localStorage.getItem('upd_bad')||0)){if(manual)toast("You're up to date");return}
  const h=await (await fetch(UPD_URL+'app.html?v='+j.v,{cache:'no-store'})).text();
  const hex=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(h)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hex!==j.sha256||!h.includes('APP_VERSION='+j.v))throw Error('the download did not match');
  await N.Filesystem.writeFile({path:'app/index.html',data:h,directory:N.Directory.Data,encoding:N.Encoding.UTF8,recursive:true});
  toast('Update ready',()=>location.reload(),'Opens the new version','', 'Restart')
 }catch(e){if(manual)toast("Couldn't check for updates",null,String(e.message||e))}}
$('#avb').onclick=()=>checkUpdate(true);
// ---- settings: when a day starts ----
function renderSet(){$('#avs').textContent=verLabel();
 const[h,m]=dsm();$('#dsi').value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');$('#dsr').disabled=!(h||m);
 $('#dsn').textContent=(h||m)?`Days run ${dsLabel()} to ${dsLabel()}.`:'Days run midnight to midnight.'}
function setDayStart(v){S.set.ds=v;save();day=d0(Date.now());lastToday=day;render();
 cm=new Date(new Date(day).getFullYear(),new Date(day).getMonth(),1).getTime();renderSet()}
$('#dsi').addEventListener('change',()=>{if(!$('#dsi').value)return renderSet();setDayStart($('#dsi').value);toast('Day starts at '+dsLabel())});
$('#dsr').onclick=()=>{setDayStart('00:00');toast('Days run midnight to midnight')};
// ---- item list (sub-screen) ----
let K='p';
function openList(k){K=k;$('#list').className='view '+k;$('#lico').innerHTML=ICON[k];$('#lt').textContent='My '+PL[k];
 $('#home').hidden=true;$('#cal').hidden=true;$('#set').hidden=true;$('#list').hidden=false;scrollTo(0,0);renderList()}
function closeList(){$('#list').hidden=true;$('#home').hidden=view!=='home';$('#cal').hidden=view!=='cal';$('#set').hidden=view!=='set'}
function renderList(){
 const its=S.it.filter(x=>x.k===K),L=dayE();
 $('#lsub').textContent=isToday()?'Today':new Date(day).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 $('#lhint').textContent=its.length?`Tap a ${NAME[K].toLowerCase()} to log it. Hold for options.`:'';
 $('#items').innerHTML=(its.length?'':`<div class="emptyl">No ${PL[K]} saved yet.<br>Add your first one below.</div>`)
  +its.map(x=>{const n=L.filter(e=>e.iid===x.id).reduce((a,e)=>a+qty(e),0);
   const c=icol(x);return `<div class="ti ${K}" style="--ic:${c};--tx:${textOn(c)}"><button class="it" data-id="${x.id}" aria-label="${esc(lab(x))}${mgs(x)?', '+mgs(x):''}">${n?`<span class="n">×${n}</span>`:''}<span class="top">${x.b?`<small>${esc(x.b)}</small>`:''}${x.ty?`<b>${esc(x.ty)}</b>`:''}</span><span class="bot">${mgs(x)?esc(mgs(x)):''}</span></button><button class="ed" data-ed="${x.id}" aria-label="Edit ${esc(lab(x))}">${PEN}</button></div>`}).join('')
  +`<button class="addit" id="addit" aria-label="Add ${NAME[K].toLowerCase()}">${SVG.plus}</button>`;
}
$('#back').onclick=closeList;
$('#items').addEventListener('click',ev=>{
 if(ev.target.closest('#addit'))return openForm();
 const ed=ev.target.closest('[data-ed]');if(ed){const x=S.it.find(i=>i.id===ed.dataset.ed);return x&&openForm(x)}
 const b=ev.target.closest('.it');if(!b)return;if(lpDone){lpDone=false;return}const x=S.it.find(i=>i.id===b.dataset.id);if(!x)return;
 logItem(x);
});
// ---- "How many?" sheet ----
let qItem=null,qN=1;
function askQty(x){qItem=x;qN=1;$('#qh').textContent=lab(x);$('#qs').textContent='How many?';showQ();qNow();$('#qd').showModal()}
let qCustom=false;function qNow(){qCustom=false;$('#qtm').value=hm(Date.now());$('#qnow').classList.add('on')}
$('#qnow').onclick=qNow;$('#qtm').addEventListener('input',()=>{qCustom=true;$('#qnow').classList.remove('on')});
function showQ(){$('#qn').textContent=qN;document.querySelectorAll('.qp button').forEach(b=>b.classList.toggle('on',+b.dataset.q===qN));
 $('#qt').textContent=mgs(qItem)?'= '+fmg(qItem.mg*qN)+' mg total':'';$('#qok').textContent=`Log ${qN} tablet${qN>1?'s':''}`}
$('#qd').addEventListener('click',ev=>{const b=ev.target.closest('.qb,[data-q]');if(!b)return;
 qN=b.dataset.q?+b.dataset.q:Math.min(99,Math.max(1,qN+ +b.dataset.d));showQ()});
$('#qc').onclick=()=>$('#qd').close();
$('#qf').addEventListener('submit',()=>{if(qItem)logItem(qItem,qN,qCustom?$('#qtm').value:'')});
// ---- change time (powder toast) ----
let tdE=null;
function changeTime(e){tdE=e;$('#tds').textContent=lab(e)+' · when did you take it?';$('#tdi').value=hm(e.ts);$('#td').showModal()}
$('#tdc').onclick=()=>$('#td').close();
$('#tf').addEventListener('submit',()=>{const v=$('#tdi').value;if(!tdE||!v)return;const[h,m]=v.split(':').map(Number);tdE.ts=inDay(d0(tdE.ts),h,m);save();render();
 toast(lab(tdE),null,'Time set to '+clk(tdE.ts))});
const atTime=v=>{if(!v&&isToday())return Date.now();const now=new Date(),[h,m]=v?v.split(':').map(Number):[now.getHours(),now.getMinutes()];return inDay(day,h,m,v?0:now.getSeconds())};
// ---- powder: amount sheet, defaults to the last amount used for that item ----
let pItem=null,pCustom=false;
const lastAmt=x=>{const l=S.e.filter(e=>e.iid===x.id&&e.t==='p'&&hasMg(e)).sort((a,b)=>b.ts-a.ts)[0];return l?{v:+l.mg,used:true}:{v:hasMg(x)?+x.mg:'',used:false}};
function askAmt(x){pItem=x;const a=lastAmt(x);$('#ph').textContent=lab(x);$('#pm').value=a.v;$('#perr').hidden=true;
 $('#pt').textContent=a.v!==''?(a.used?'Last used: ':'Saved amount: ')+fmg(a.v)+' mg':'';pNow();$('#pd').showModal();$('#pm').select()}
function pNow(){pCustom=false;$('#ptm').value=hm(Date.now());$('#pnow').classList.add('on')}
$('#pnow').onclick=pNow;$('#ptm').addEventListener('input',()=>{pCustom=true;$('#pnow').classList.remove('on')});
$('#pc').onclick=()=>$('#pd').close();
$('#pf').addEventListener('submit',ev=>{const r=$('#pm').value.trim().replace(',','.');
 if(r===''||!isFinite(r)||+r<0){ev.preventDefault();$('#perr').textContent='Enter the amount in mg.';$('#perr').hidden=false;return}
 logItem(pItem,0,pCustom?$('#ptm').value:'',+r)});
function logItem(x,q,tm,amt){
 if(x.k==='t'&&!q)return askQty(x);
 if(x.k==='p'&&amt==null)return askAmt(x);
 const ts=atTime(tm);
 const e={id:uid(),t:x.k,ts,iid:x.id,b:x.b,ty:x.ty,mg:x.k==='p'?amt:x.mg,c:icol(x)};if(q>1)e.q=q;S.e.push(e);save();render(); // stay on the list so several can be logged in a row
 const big=$('.big.'+x.k);big.classList.remove('pop');void big.offsetWidth;big.classList.add('pop');
 navigator.vibrate&&navigator.vibrate(15);
 toast((q>1?q+' × ':'')+lab(x),()=>{S.e=S.e.filter(i=>i.id!==e.id);save();render()},'Logged at '+clk(ts));
}
// ---- add / edit form ----
let editing=null,fCol='#7C4DFF';const F=$('#f');
function renderSw(){const cu=!PAL.includes(fCol);$('#sw').innerHTML=PAL.map(c=>`<button type="button" data-c="${c}" style="--sc:${c}" class="${c===fCol?'on':''}" aria-label="Color ${c}"></button>`).join('')+`<label class="cust${cu?' on':''}" title="Custom color"><input type="color" id="fcc" value="${fCol}"></label>`}
$('#sw').addEventListener('click',ev=>{const b=ev.target.closest('[data-c]');if(b){fCol=b.dataset.c;renderSw()}});
$('#sw').addEventListener('input',ev=>{if(ev.target.id==='fcc'){fCol=ev.target.value.toUpperCase();$('#sw').querySelectorAll('button').forEach(b=>b.classList.remove('on'));ev.target.parentNode.classList.add('on')}});
function openForm(x,copy){editing=x&&!copy?x:null;F.reset();$('#ferr').hidden=true;$('#fd').className=K;
 $('#fh').textContent=editing?'Edit '+NAME[K].toLowerCase():'New '+NAME[K].toLowerCase();$('#fdel').hidden=!editing;
 fCol=editing?icol(x):freeCol();renderSw();
 if(x){F.b.value=x.b||'';F.ty.value=x.ty||'';F.mg.value=x.mg??'';F.nt.value=x.nt||''}
 $('#fd').showModal();if(!editing)F.b.focus()}
$('#fcan').onclick=()=>$('#fd').close();
F.addEventListener('submit',ev=>{
 const b=F.b.value.trim(),ty=F.ty.value.trim(),nt=F.nt.value.trim(),mr=F.mg.value.trim().replace(',','.');
 const err=m=>{ev.preventDefault();$('#ferr').textContent=m;$('#ferr').hidden=false};
 if(!b&&!ty)return err('Enter a brand or a type.');
 if(mr&&!(isFinite(mr)&&+mr>=0))return err('Mg must be a number.');
 const mg=mr?+mr:'';
 if(editing)Object.assign(editing,{b,ty,mg,nt,c:fCol});else S.it.push({id:uid(),k:K,b,ty,mg,nt,c:fCol});
 save();renderList();toast(editing?'Saved':'Added '+(b||ty));
});
function deleteItem(x){const i=S.it.indexOf(x);if(i<0)return;S.it.splice(i,1);save();renderList();
 toast('Deleted '+lab(x),()=>{S.it.splice(i,0,x);save();renderList()},'Past log entries are kept')}
$('#fdel').onclick=()=>{if(!editing||!confirm(`Delete "${lab(editing)}"? Past log entries stay.`))return;const x=editing;$('#fd').close();deleteItem(x)};
// ---- hold a tile: options sheet ----
const when=ts=>{const d=new Date(ts),t=d0(ts),n=d0(Date.now());return (t===n?'Today':t===d0(Date.now()-864e5)?'Yesterday':d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))+', '+clk(ts)};
let oItem=null;
function openOpts(x,confirmDel){oItem=x;const E=S.e.filter(e=>e.iid===x.id),last=E.reduce((a,e)=>e.ts>a?e.ts:a,0),tot=E.reduce((a,e)=>a+emg(e),0),qn=E.reduce((a,e)=>a+qty(e),0);
 const quick=x.k==='t'?'1 tablet':(lastAmt(x).v!==''?fmg(lastAmt(x).v)+' mg':'now');
 $('#od').className=x.k;
 $('#obody').innerHTML=`<h3>${esc(lab(x))}</h3>${x.nt?`<p class="onote">${esc(x.nt)}</p>`:`<p class="onote">${mgs(x)||'No amount saved'}</p>`}
  <div class="ostat"><div><b>${qn}</b><small>Taken</small></div><div><b>${last?esc(when(last)):'Never'}</b><small>Last</small></div><div><b>${tot?fmg(tot):'0'}</b><small>Total mg</small></div></div>
  ${confirmDel?`<p class="dq">Delete “${esc(lab(x))}”? Your past log entries are kept.</p><div class="btns"><button type="button" id="odno">Cancel</button><button type="button" class="ok bad" id="odyes">Delete</button></div>`
  :`<div class="acts"><button class="act" data-a="log">${SVG.chk}<span>Log now<small>${quick}, at the current time</small></span></button>
   <button class="act" data-a="edit">${SVG.pen}<span>Edit<small>Name, amount, note, colour</small></span></button>
   <button class="act" data-a="dup">${SVG.copy}<span>Duplicate<small>Same details, e.g. a different strength</small></span></button>
   <button class="act bad" data-a="del">${SVG.trash}<span>Delete<small>Removes it from this list</small></span></button></div>`}`;
 if(!$('#od').open)$('#od').showModal()}
$('#od').addEventListener('click',ev=>{
 if(ev.target===$('#od'))return $('#od').close();
 if(ev.target.id==='odno')return openOpts(oItem);
 if(ev.target.id==='odyes'){const x=oItem;$('#od').close();return deleteItem(x)}
 const b=ev.target.closest('[data-a]');if(!b)return;const x=oItem,a=b.dataset.a;
 if(a==='del')return openOpts(x,true);
 $('#od').close();
 if(a==='edit')openForm(x);
 else if(a==='dup')openForm(x,true),(F.b.value=x.b||'',F.ty.value=x.ty||'',F.mg.value=x.mg??'',F.nt.value=x.nt||'');
 else if(a==='log'){if(x.k==='t')logItem(x,1);else logItem(x,0,'',lastAmt(x).v)}});
// long press (450 ms) on a tile; a normal tap still logs
let lpT=null,lpX=0,lpY=0,lpDone=false;
const items=$('#items');
items.addEventListener('pointerdown',ev=>{const b=ev.target.closest('.it');if(!b)return;lpDone=false;lpX=ev.clientX;lpY=ev.clientY;clearTimeout(lpT);
 lpT=setTimeout(()=>{const x=S.it.find(i=>i.id===b.dataset.id);if(!x)return;lpDone=true;navigator.vibrate&&navigator.vibrate(25);openOpts(x)},450)});
const lpCancel=()=>clearTimeout(lpT);
items.addEventListener('pointermove',ev=>{if(Math.hypot(ev.clientX-lpX,ev.clientY-lpY)>10)lpCancel()});
['pointerup','pointercancel','pointerleave'].forEach(n=>items.addEventListener(n,lpCancel));
items.addEventListener('contextmenu',ev=>ev.preventDefault());
// ---- toast ----
let tt;function toast(msg,undo,sub,chg,ul){clearTimeout(tt);$('#tm').innerHTML=esc(msg)+(sub?`<small>${esc(sub)}</small>`:'');$('#tu').textContent=undo?(ul||'Undo'):'';$('#tu').onclick=()=>{undo();hide()};
 $('#tc').textContent=chg?'Change time':'';$('#tc').onclick=()=>{hide();chg()};$('#toast').classList.add('on');tt=setTimeout(hide,chg?6000:4000)}
function hide(){$('#toast').classList.remove('on')}
// ---- log interactions ----
document.querySelectorAll('.big').forEach(b=>b.addEventListener('click',()=>openList(b.dataset.t)));
$('#log').addEventListener('click',ev=>{const x=ev.target.closest('.x');if(!x)return;const id=x.closest('li').dataset.id,e=S.e.find(a=>a.id===id);
 S.e=S.e.filter(a=>a.id!==id);save();render();toast(NAME[e.t]+' removed',()=>{S.e.push(e);save();render()})});
$('#log').addEventListener('change',ev=>{const i=ev.target;if(i.type!=='time'||!i.value)return;const e=S.e.find(a=>a.id===i.closest('li').dataset.id);
 const[h,m]=i.value.split(':').map(Number);e.ts=inDay(d0(e.ts),h,m);save();render()});
$('#prev').onclick=()=>{day=d0(day-12*36e5);render()};
$('#next').onclick=()=>{if(!isToday()){day=d0(day+36*36e5);render()}};
$('#today').onclick=()=>{day=d0(Date.now());render()};
// ---- backup: export a file through the Share sheet (phone) or a download (browser); import merges by id ----
$('#exp').onclick=async()=>{
 const name='daily-vitamins-'+new Date().toISOString().slice(0,10)+'.json',data=JSON.stringify({app:'daily-vitamins',v:2,e:S.e,it:S.it,set:S.set});
 try{if(window.N){const{Filesystem,Directory,Encoding,Share}=N;
   const w=await Filesystem.writeFile({path:name,data,directory:Directory.Cache,encoding:Encoding.UTF8});
   await Share.share({title:'Daily Vitamins backup',files:[w.uri]});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()}
 }catch(e){if(!/cancel/i.test(e.message||''))toast('Export failed: '+(e.message||e))}};
$('#imp').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(d.app!=='daily-vitamins'||!Array.isArray(d.e))throw Error('not a Daily Vitamins backup');
  const have=new Set(S.e.map(e=>e.id));const add=d.e.filter(e=>e&&e.id&&!have.has(e.id)&&(e.t==='p'||e.t==='t')&&typeof e.ts==='number');
  const hi=new Set(S.it.map(x=>x.id)),ai=(Array.isArray(d.it)?d.it:[]).filter(x=>x&&x.id&&!hi.has(x.id)&&(x.k==='p'||x.k==='t'));
  S.e.push(...add);S.it.push(...ai);save();render();const n=add.length+ai.length;toast(n?`Imported ${add.length} entries, ${ai.length} items`:'Nothing new to import');
 }catch(e){toast('Import failed: '+e.message)}};
// ---- keep fresh and roll over at midnight ----
lastToday=d0(Date.now());
const tick=()=>{const t=d0(Date.now());if(t!==lastToday){if(day===lastToday)day=t;lastToday=t}render()};
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
// ---- phone back button: dialogs, then the item list, then Calendar -> Log, then back to today, else leave ----
if(window.N)N.App.addListener('backButton',()=>{if($('#od').open)$('#od').close();else if($('#td').open)$('#td').close();else if($('#pd').open)$('#pd').close();else if($('#qd').open)$('#qd').close();else if($('#fd').open)$('#fd').close();else if(!$('#list').hidden)closeList();else if(view!=='home')go('home');else if(!isToday()){day=d0(Date.now());render()}else N.App.exitApp()});
render();
try{localStorage.removeItem('upd_boot')}catch(e){} // a bad update never reaches this line, so the loader drops it next launch
if(canUpd()&&Date.now()-(+localStorage.getItem('upd_last')||0)>6*36e5)setTimeout(()=>checkUpdate(false),3000);
</script>
